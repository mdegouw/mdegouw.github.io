  <path d="M9 10.6 14.4 16 9 21.4" fill="none" stroke="#3ddc84" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="18.2" y="9.4" width="4.6" height="13.2" rx=".6" fill="#3ddc84"/>
</svg>
