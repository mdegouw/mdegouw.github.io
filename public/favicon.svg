<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Mathijs de Gouw">
  <!-- The hero's terminal prompt reduced to its two glyphs: the `>` caret and
       the `▋` block cursor. Deliberately dark in both colour schemes — the tile
       is a mark, not UI, and the site is dark-first. -->
